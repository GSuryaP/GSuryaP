
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surya | Live Terminal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #020503;
    color: #00ff66;
    font-family: monospace;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  main { width: 100%; padding: 12px; }
  header {
    color: #00ff66;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    text-shadow: 0 0 8px #00ff6670;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    background: #010301;
  }
  footer {
    color: #008d3c;
    font-size: 11px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<main>
  <header>surya@developer:~$ ./matrix_portrait</header>
  <canvas id="screen"></canvas>
  <footer id="status">INITIALIZING CHARACTER STREAM...</footer>
</main>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

const image = new Image();
image.src = "./portrait.jpg";

const chars = " .,:;-=+*xX#%@01ABCDEF";
const cellW = 7;
const cellH = 11;
let cols, rows, pixels, frame = 0;

image.onload = () => {
  // Responsive, wide terminal grid
  cols = Math.min(220, Math.max(80,
    Math.floor(window.innerWidth / cellW)));
  rows = Math.round(cols * image.height /
    image.width * cellW / cellH);

  canvas.width = cols * cellW;
  canvas.height = rows * cellH;

  const off = document.createElement("canvas");
  off.width = cols;
  off.height = rows;

  const octx = off.getContext("2d", {
    willReadFrequently: true
  });
  octx.drawImage(image, 0, 0, cols, rows);
  pixels = octx.getImageData(0, 0, cols, rows).data;

  // Render at a lower resolution; scale CSS to full width
  animate();
};

function animate() {
  frame++;
  ctx.fillStyle = "#010301";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = `${cellH - 1}px monospace`;
  ctx.textBaseline = "top";

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const r = pixels[i], g = pixels[i + 1],
            b = pixels[i + 2];

      // Facial detail comes from the source image.
      const lum = (0.299*r + 0.587*g + 0.114*b) / 255;

      // Moving wave controls brightness.
      const wave = Math.sin(x * 0.10 + y * 0.045
                           - frame * 0.055);
      const pulse = Math.sin(frame * 0.035 + y * 0.07);
      const brightness = Math.max(0, Math.min(1,
        lum * 0.72 + (wave + 1) * 0.12
        + (pulse + 1) * 0.04
      ));

      // Mostly stable glyphs, with occasional character mutations.
      const seed = Math.sin(x * 127.1 + y * 311.7);
      const flicker = Math.sin(frame * 0.17 + x * 0.7
                               + y * 1.3);
      let value = brightness;

      if (seed > 0.985 && flicker > 0.5) {
        value = Math.random() * 0.85;
      }

      const idx = Math.min(chars.length - 1,
        Math.floor(value * (chars.length - 1)));

      const green = Math.floor(65 + brightness * 190);
      const blue = Math.floor(brightness * 35);

      ctx.fillStyle = `rgb(0,${green},${blue})`;
      ctx.fillText(chars[idx], x * cellW, y * cellH);
    }
  }

  status.textContent =
    `STREAM ACTIVE // ${cols}x${rows} // FRAME ${frame}`;

  requestAnimationFrame(animate);
}

image.onerror = () => {
  status.textContent =
    "ERROR: ADD portrait.jpg NEXT TO index.html";
};
</script>
</body>
</html>
