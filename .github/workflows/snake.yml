name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake-dark.svg?color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Turn green cells to blue shades when eaten & remove progress bar
        run: |
          python3 - << 'EOF'
          import glob, os, re

          # Blue shades matching each green contribution level:
          # c1: #0e4429 (dark green)   -> b1: #0d419d (dark blue)
          # c2: #006d32 (normal green) -> b2: #1f6feb (normal blue)
          # c3: #26a641 (light green)  -> b3: #388bfd (light blue)
          # c4: #39d353 (bright green) -> b4: #79c0ff (bright cyan-blue)
          b1, b2, b3, b4 = '#0d419d', '#1f6feb', '#388bfd', '#79c0ff'

          def transform_svg(filepath):
              if not os.path.exists(filepath):
                  return
              with open(filepath, 'r', encoding='utf-8') as f:
                  svg = f.read()

              # 1. Inject blue color variables into :root
              b_vars = f"--b1:{b1};--b2:{b2};--b3:{b3};--b4:{b4}"
              svg = re.sub(r':root\{([^}]+)\}', rf':root{{\1;{b_vars}}}', svg, count=1)

              # 2. In keyframes: from 0% until the snake hits, cell is green (--c1..--c4);
              #    once the snake meets it, cell changes to blue (--b1..--b4) through 100%.
              pattern = re.compile(r'(@keyframes c\w+\{)([0-9.]+%\s*\{fill:var\(--c([1-4])\)\}\s*[0-9.]+%\s*,\s*100%\s*\{fill:var\()--ce(\)\}\})')
              def repl(m):
                  prefix = m.group(1)
                  green_range = m.group(2)
                  c_level = m.group(3)
                  suffix = m.group(4)
                  if not green_range.startswith('0%'):
                      green_range = '0%,' + green_range
                  return f'{prefix}{green_range}--b{c_level}{suffix}'

              svg = pattern.sub(repl, svg)

              # 3. Remove bottom progress bar (.u) elements and keyframes
              svg = re.sub(r'<rect class="u [^"]*"[^>]*/>', '', svg)
              svg = re.sub(r'@keyframes u\w+{[^}]*}', '', svg)
              svg = re.sub(r'\.u[^{]*{[^}]*}', '', svg)

              # 4. Adjust viewBox and height from 192 to 176 (removing the empty space left by the bar)
              svg = re.sub(r'viewBox="(-?\d+\s+-?\d+\s+\d+\s+)192"', r'viewBox="\g<1>176"', svg)
              svg = re.sub(r'(<svg[^>]*\bheight=)["\']192["\']', r'\g<1>"176"', svg)

              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(svg)
              print(f"Successfully transformed {filepath} (green -> blue transition, progress bar removed)")

          for svg_file in glob.glob('dist/*.svg'):
              transform_svg(svg_file)
          EOF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
